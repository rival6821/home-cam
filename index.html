<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22HomeCam%20Viewer%22%2C%22short_name%22%3A%22HomeCam%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22background_color%22%3A%22%230b0f10%22%2C%22theme_color%22%3A%22%230b0f10%22%7D">
<title>홈캠 뷰어</title>
<style>
  /* 영상 시청 도구는 시스템 테마와 무관하게 어두운 플레이어 크롬 하나로 고정한다
     (YouTube/Netflix 등과 같은 관행 — 영상 자체의 대비를 지키기 위한 의도적 단일 테마).
     외부 폰트·라이브러리 요청 없음. */
  :root{
    --bg:#0b0f10; --surface:#12181a; --surface-2:#1a2225; --line:#253034;
    --ink:#e7ecea; --ink-soft:#93a3a8; --muted:#5c6c70;
    --live:#3fbfc4; --warn:#e6a23c; --danger:#e2695c;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%; margin:0; background:var(--bg);}
  body{ font-family:var(--font); color:var(--ink); min-height:100dvh; }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }

  .screen{ position:fixed; inset:0; display:flex; }
  .center{ margin:auto; width:100%; max-width:420px; padding:28px; }

  /* ── 설정 화면 ── */
  .brand{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  h1{ font-size:22px; margin:0 0 4px; }
  .lede{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; line-height:1.6; }
  label{ display:block; font-size:13px; color:var(--ink-soft); margin:16px 0 6px; }
  input[type=text], input[type=password]{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-family:var(--font-mono); font-size:16px; padding:12px 14px; border-radius:6px; outline:none;
  }
  input:focus{ border-color:var(--live); }
  .err{ font-size:12px; color:var(--danger); margin-top:6px; min-height:14px; }
  /* ── PIN 표시 토글 ──
     입력칸 안쪽 오른쪽에 겹쳐 놓는다. 아이콘은 인라인 SVG다 — 외부 요청 없이
     동작해야 하는 단일 파일 원칙(위 주석 참고)에 따라 아이콘 폰트를 쓰지 않는다. */
  .pin-field{ position:relative; }
  .pin-field input{ padding-right:46px; }
  .pin-reveal{
    position:absolute; top:0; right:0; width:46px; height:100%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; border-radius:0 6px 6px 0; color:var(--ink-soft);
  }
  .pin-reveal:active{ color:var(--ink); }
  .pin-reveal svg{ width:20px; height:20px; display:block; }
  .pin-reveal .eye-off{ display:none; }
  .pin-reveal.revealed .eye{ display:none; }
  .pin-reveal.revealed .eye-off{ display:block; }
  button{ font-family:var(--font); font-size:15px; font-weight:600; border:none; border-radius:8px; padding:13px 16px; cursor:pointer; }
  .btn-primary{ background:var(--live); color:#04211f; width:100%; margin-top:20px; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line); width:100%; }
  .recent{ margin-top:24px; }
  .recent-title{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .recent-item{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:11px 14px; margin-bottom:8px; color:var(--ink); font-size:14px; text-align:left;
  }
  .recent-item span.p{ color:var(--muted); font-family:var(--font-mono); font-size:12px; }

  /* ── 플레이어 화면 ── */
  #playerScreen{ flex-direction:column; background:#000; }
  /* min-height:0 — flex 항목의 기본 최소 높이(auto)는 "콘텐츠 크기"라서, 이게 없으면
     영상 원본 크기에 끌려 플레이어가 화면보다 커지고 아래쪽이 잘린다(가로 모드나
     세로 영상에서 특히 심하다). touch-action:none — 핀치·드래그를 브라우저의 페이지
     확대/스크롤이 아니라 아래 스크립트의 영상 확대/이동으로 받는다. */
  .player-wrap{
    position:relative; flex:1; min-height:0; overflow:hidden; background:#000;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .player-wrap.zoomed{ cursor:grab; }
  .player-wrap.panning{ cursor:grabbing; }
  /* 영상 상자는 항상 플레이어 영역과 정확히 같은 크기이고 그 안에서 contain으로 그린다 —
     비율이 달라도 잘리지 않고 남는 쪽이 검은 레터박스가 된다. 확대는 이 상자 위에
     transform만 얹는다(스크립트의 "확대/축소" 절). */
  #playerVideo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; background:#000; transform-origin:0 0;
  }
  #playerVideo.zoom-animate{ transition:transform .18s ease-out; }

  .top-bar{
    position:absolute; top:0; left:0; right:0; padding:calc(14px + env(safe-area-inset-top)) 16px 28px;
    display:flex; align-items:center; gap:10px; background:linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
    transition:opacity .2s ease;
  }
  .status-pill{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-family:var(--font-mono); color:var(--ink-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .dot.live{ background:var(--live); box-shadow:0 0 8px var(--live); }
  .dot.warn{ background:var(--warn); }
  .dot.error{ background:var(--danger); }
  .cam-name{ font-weight:600; font-size:14px; }
  /* 송출 폰 배터리 — 부족하면 경고색, 보고가 끊기면 흐리게 */
  .battery-pill{ font-size:12.5px; font-family:var(--font-mono); color:var(--ink-soft); white-space:nowrap; }
  .battery-pill.low{ color:var(--warn); }
  .battery-pill.critical{ color:var(--danger); }
  .battery-pill.stale{ color:var(--muted); }
  .top-bar .spacer{ flex:1; }
  .icon-btn{
    background:rgba(255,255,255,.08); border:none; color:var(--ink); width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:16px; padding:0;
  }
  .rec-badge{
    display:flex; align-items:center; gap:6px; background:rgba(226,105,92,.15); color:var(--danger);
    font-family:var(--font-mono); font-size:12px; padding:5px 10px; border-radius:20px;
  }
  .rec-dot{ width:7px; height:7px; border-radius:50%; background:var(--danger); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .bottom-bar{
    position:absolute; bottom:0; left:0; right:0; padding:20px 16px calc(20px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:18px;
    background:linear-gradient(to top, rgba(0,0,0,.7), transparent);
    transition:opacity .2s ease;
  }
  .big-icon-btn{
    background:rgba(255,255,255,.1); border:none; color:var(--ink); width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:20px; padding:0;
  }
  .big-icon-btn.recording{ background:var(--danger); color:#fff; }

  /* ── 확대/축소 ── − [배율] + 를 한 알약으로 묶는다. 배율을 누르면 원래 크기(전체 보기)로. */
  .zoom-group{
    display:flex; align-items:center; height:52px; padding:0 4px; border-radius:26px;
    background:rgba(255,255,255,.1);
  }
  .zoom-btn{
    background:none; border:none; color:var(--ink); width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:400; padding:0;
  }
  .zoom-btn:disabled{ color:var(--muted); cursor:default; }
  .zoom-level{
    background:none; border:none; color:var(--ink-soft); min-width:48px; height:44px; padding:0 4px;
    font-family:var(--font-mono); font-size:13px; font-weight:500; border-radius:22px;
  }
  .zoom-level.active{ color:var(--live); }
  /* 확대한 채로 컨트롤이 숨으면 "지금 일부만 보고 있다"는 걸 잊기 쉽다 — 구석에 배율만 남긴다. */
  .zoom-badge{
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; pointer-events:none;
    font-family:var(--font-mono); font-size:12px; color:var(--ink); background:rgba(0,0,0,.45);
    padding:4px 9px; border-radius:12px; opacity:0; transition:opacity .2s ease;
  }
  .chrome-hidden .zoom-badge{ opacity:1; }

  .chrome-hidden .top-bar, .chrome-hidden .bottom-bar{ opacity:0; pointer-events:none; }

  .unmute-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35);
  }
  .unmute-btn{
    background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.3);
    padding:14px 22px; border-radius:30px; font-size:14px; display:flex; gap:8px; align-items:center;
  }

  .toast{
    position:absolute; left:50%; bottom:100px; transform:translateX(-50%);
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .back-link{ position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; font-size:13px; color:var(--ink-soft); background:none; border:none; }
</style>
</head>
<body>

  <!-- ════════ 설정 화면 ════════ -->
  <section id="setupScreen" class="screen">
    <div class="center">
      <div class="brand">HOMECAM · 뷰어</div>
      <h1>카메라 시청 연결</h1>
      <p class="lede">가족에게 받은 카메라 경로와 시청 PIN을 입력하세요. 값은 이 기기에만 저장됩니다.</p>

      <form id="setupForm">
        <label for="pathInput">카메라 경로</label>
        <input id="pathInput" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" placeholder="livingroom" maxlength="32">
        <label for="pinInput">시청 PIN</label>
        <div class="pin-field">
          <input id="pinInput" type="password" inputmode="latin" autocapitalize="off" autocorrect="off" placeholder="가족 공용 시청 PIN" maxlength="32">
          <button type="button" class="pin-reveal" id="pinReveal" aria-label="PIN 표시" aria-pressed="false" aria-controls="pinInput">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.8 12S5.4 5.2 12 5.2 22.2 12 22.2 12 18.6 18.8 12 18.8 1.8 12 1.8 12Z"/>
            <circle cx="12" cy="12" r="3.2"/>
          </svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.9 5.5A9.7 9.7 0 0 1 12 5.2c6.6 0 10.2 6.8 10.2 6.8a18.3 18.3 0 0 1-2.9 3.9"/>
            <path d="M6.5 6.7A17.9 17.9 0 0 0 1.8 12S5.4 18.8 12 18.8c1.9 0 3.6-.6 5-1.4"/>
            <path d="M10.1 10.1a2.7 2.7 0 0 0 3.8 3.8"/>
            <path d="M3 3l18 18"/>
          </svg>
          </button>
        </div>
        <div class="err" id="setupErr"></div>
        <button type="submit" class="btn-primary">시청 시작</button>
      </form>

      <div class="recent" id="recentWrap" hidden>
        <div class="recent-title">최근 접속</div>
        <div id="recentList"></div>
      </div>
    </div>
  </section>

  <!-- ════════ 플레이어 화면 ════════ -->
  <section id="playerScreen" class="screen" hidden>
    <div class="player-wrap" id="playerWrap">
      <video id="playerVideo" playsinline muted autoplay></video>

      <!-- 화면 전체를 덮는 막이라 컨트롤 바들보다 먼저 둔다 — 뒤에 두면 "← 변경"까지 덮어
           소리를 켜기 전에는 카메라를 바꿀 수 없다. -->
      <div class="unmute-overlay" id="unmuteOverlay">
        <button class="unmute-btn" id="unmuteBtn">🔇 탭하여 소리 켜기</button>
      </div>

      <div class="top-bar" id="topBar">
        <button class="back-link" id="backBtn" style="position:static;">← 변경</button>
        <span class="cam-name" id="camNameLabel">–</span>
        <div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">연결 중…</span></div>
        <span class="battery-pill" id="batteryPill" hidden></span>
        <div class="spacer"></div>
        <span class="rec-badge" id="recBadge" hidden><span class="rec-dot"></span><span id="recTimer">00:00</span></span>
      </div>

      <div class="zoom-badge" id="zoomBadge" hidden></div>

      <div class="bottom-bar" id="bottomBar">
        <div class="zoom-group" role="group" aria-label="확대/축소">
          <button class="zoom-btn" id="zoomOutBtn" title="축소" aria-label="축소">−</button>
          <button class="zoom-level" id="zoomResetBtn" title="원래 크기로(전체 보기)" aria-label="현재 배율 — 누르면 원래 크기로">1×</button>
          <button class="zoom-btn" id="zoomInBtn" title="확대" aria-label="확대">+</button>
        </div>
        <button class="big-icon-btn" id="recordBtn" title="녹화">⏺</button>
        <button class="big-icon-btn" id="fullscreenBtn" title="전체화면">⛶</button>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </section>

<script>
(function(){
  'use strict';

  // ───────────────────────── 상수(마스터플랜 §2·§3 값과 동일) ─────────────────────────
  const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
  const ICE_GATHER_TIMEOUT = 4000;
  const RECONNECT_BASE = 1000, RECONNECT_FACTOR = 1.8, RECONNECT_MAX = 30000, RECONNECT_JITTER = 0.2;
  const WATCHDOG_INTERVAL = 60000, WATCHDOG_MAX_STALLS = 3;
  const PATH_PIN_RE = /^[A-Za-z0-9_-]{1,32}$/;
  const RECENT_KEY = 'homecam.viewer.recent';
  const RECENT_MAX = 5;
  const BATTERY_POLL_INTERVAL = 30000;     // 카메라는 1분마다 보고하므로 30초면 충분
  const BATTERY_STALE_AFTER = 180;         // 초 — 하트비트 3번을 놓치면 "보고 끊김"으로 표시
  const BATTERY_LOW = 0.2, BATTERY_CRITICAL = 0.1;
  const ZOOM_LEVELS = [1, 1.5, 2, 3, 4];   // 버튼이 거치는 배율 — 송출이 최대 720p라 4배 이상은 뭉개진다
  const ZOOM_MAX = ZOOM_LEVELS[ZOOM_LEVELS.length - 1];
  const ZOOM_DOUBLE_TAP = 2.5;
  const TAP_SLOP = 10, TAP_MAX_MS = 300, DOUBLE_TAP_MS = 320, DOUBLE_TAP_SLOP = 40;

  class AuthError extends Error {}

  // ───────────────────────── §2.3 MediaRecorder 코덱 매트릭스 ─────────────────────────
  function isIOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function recorderMimeCandidates(){
    // iOS: 14.5~18.3은 MP4/H.264만, 18.4+는 WebM도 가능 → MP4를 먼저 시도해 두 구간 모두 커버
    // Android Chrome: WebM/VP8이 표준 경로, MP4는 보조
    return isIOS()
      ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp8,opus']
      : ['video/webm;codecs=vp8,opus', 'video/mp4'];
  }
  function pickSupportedMime(){
    for (const mime of recorderMimeCandidates()) {
      try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(mime)) return mime; } catch (e) {}
    }
    return '';
  }

  // ───────────────────────── 엘리먼트 ─────────────────────────
  const screens = { setup: document.getElementById('setupScreen'), player: document.getElementById('playerScreen') };
  const playerVideo = document.getElementById('playerVideo');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const camNameLabel = document.getElementById('camNameLabel');
  const unmuteOverlay = document.getElementById('unmuteOverlay');
  const topBar = document.getElementById('topBar');
  const bottomBar = document.getElementById('bottomBar');
  const playerWrap = document.getElementById('playerWrap');
  const toastEl = document.getElementById('toast');
  const recBadge = document.getElementById('recBadge');
  const recTimer = document.getElementById('recTimer');

  function showScreen(name){ Object.entries(screens).forEach(([k, el]) => { el.hidden = (k !== name); }); }
  function setStatus(kind, text){
    statusText.textContent = text;
    statusDot.className = 'dot ' + (kind === 'live' ? 'live' : kind === 'warn' ? 'warn' : kind === 'error' ? 'error' : '');
  }
  let toastTimer = null;
  function flash(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  // ───────────────────────── §2.4 설정/최근 접속 저장 ─────────────────────────
  function loadConfig(){
    const hash = new URLSearchParams(location.hash.slice(1));
    return { path: hash.get('cam') || '', pin: hash.get('pin') || '' };
  }
  function readRecent(){
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
    catch (e) { return []; } /* 프라이빗 브라우징 등으로 저장소 접근 불가 — 빈 목록으로 계속 진행 */
  }
  function pushRecent(path, pin){
    let list = readRecent().filter(item => item.path !== path);
    list.unshift({ path, pin });
    list = list.slice(0, RECENT_MAX);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }
    catch (e) { console.warn('[homecam] 최근 접속 저장 실패', e); }
  }
  function renderRecent(){
    const list = readRecent();
    const wrap = document.getElementById('recentWrap');
    const listEl = document.getElementById('recentList');
    if (list.length === 0) { wrap.hidden = true; return; }
    wrap.hidden = false;
    listEl.innerHTML = '';
    list.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'recent-item';
      btn.type = 'button';
      btn.innerHTML = `<span>${item.path}</span><span class="p">다시 연결 →</span>`;
      btn.addEventListener('click', () => connectTo(item.path, item.pin));
      listEl.appendChild(btn);
    });
  }

  // ───────────────────────── 상태 ─────────────────────────
  let config = { path: '', pin: '' };
  let pc = null, remoteStream = null, sessionUrl = null;
  let reconnectAttempt = 0, reconnecting = false;
  let watchdogTimer = null;
  let recorder = null, recordedChunks = [], recTimerHandle = null, recStartedAt = 0;

  function waitForIceGatheringComplete(peerConn, timeoutMs){
    if (peerConn.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise(resolve => {
      const check = () => { if (peerConn.iceGatheringState === 'complete') finish(); };
      const finish = () => { peerConn.removeEventListener('icegatheringstatechange', check); resolve(); };
      peerConn.addEventListener('icegatheringstatechange', check);
      setTimeout(finish, timeoutMs);
    });
  }

  // ───────────────────────── §1.2 WHEP 재생(POST /path/whep) ─────────────────────────
  async function playWhep(peerConn, path, pin){
    const res = await fetch(`/${encodeURIComponent(path)}/whep`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/sdp',
        'Authorization': 'Basic ' + btoa(`family-viewer:${pin}`)
      },
      body: peerConn.localDescription.sdp
    });
    if (res.status === 401 || res.status === 403) throw new AuthError('PIN이 올바르지 않습니다');
    if (res.status !== 201) throw new Error(`WHEP 연결 실패 (HTTP ${res.status})`);
    const location = res.headers.get('Location');
    const answerSdp = await res.text();
    await peerConn.setRemoteDescription({ type: 'answer', sdp: answerSdp });
    return resolveSessionUrl(location);
  }
  // 리버스 프록시 뒤의 MediaMTX가 Location 헤더에 내부 바인드 주소를 절대 URL로 담아
  // 돌려주는 사례가 보고되어 있다(github.com/bluenviron/mediamtx/issues/4504).
  // 경로만 취하고 항상 현재 페이지와 같은 출처로 재작성해 이 문제를 원천 차단한다.
  function resolveSessionUrl(location){
    if (!location) return null;
    const r = new URL(location, window.location.href);
    return new URL(r.pathname + r.search, window.location.href).href;
  }

  function cleanupConnection(){
    clearInterval(watchdogTimer);
    if (sessionUrl) { fetch(sessionUrl, { method: 'DELETE' }).catch(() => {}); sessionUrl = null; }
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  }

  // ───────────────────────── §3.3 지수 백오프 재연결(카메라와 동일 알고리즘) ─────────────────────────
  function scheduleReconnect(){
    if (reconnecting) return;
    reconnecting = true;
    cleanupConnection();
    const n = reconnectAttempt++;
    const base = Math.min(RECONNECT_MAX, RECONNECT_BASE * Math.pow(RECONNECT_FACTOR, n));
    const jitter = base * RECONNECT_JITTER * (Math.random() * 2 - 1);
    const wait = Math.max(250, Math.round(base + jitter));
    setStatus('warn', `재연결 대기 · ${Math.round(wait / 1000)}초 후`);
    setTimeout(() => { reconnecting = false; startWatching(); }, wait);
  }

  function onConnectionStateChange(){
    const state = pc.connectionState;
    if (state === 'connected') { reconnectAttempt = 0; setStatus('live', 'LIVE'); }
    else if (state === 'failed' || state === 'disconnected' || state === 'closed') scheduleReconnect();
  }

  function handleConnectFailure(e){
    if (e instanceof AuthError) {
      setStatus('error', 'PIN 오류');
      flash('PIN이 올바르지 않습니다 — ← 변경에서 다시 확인하세요');
      cleanupConnection();
      return; // 잘못된 PIN 자동 재시도 금지(레이트리밋 방지)
    }
    console.warn('[homecam] WHEP 연결 실패', e);
    setStatus('error', '연결 실패 — 재시도 예정');
    scheduleReconnect();
  }

  // ───────────────────────── 프레임 정지 워치독 ─────────────────────────
  function startWatchdog(){
    clearInterval(watchdogTimer);
    let lastFrames = 0, stalls = 0;
    watchdogTimer = setInterval(() => {
      if (!playerVideo.getVideoPlaybackQuality) return;
      const frames = playerVideo.getVideoPlaybackQuality().totalVideoFrames;
      if (frames === lastFrames) {
        stalls++;
        if (stalls >= WATCHDOG_MAX_STALLS) scheduleReconnect();
      } else stalls = 0;
      lastFrames = frames;
    }, WATCHDOG_INTERVAL);
  }

  // ───────────────────────── 송출 폰 배터리 상태(GET /path/status) ─────────────────────────
  // 카메라가 1분마다 올리는 배터리 값을 별도 상태 서비스(server/status)에서 읽는다.
  // 영상 연결(WHEP)과는 독립적으로 돈다 — 영상이 끊겨 재연결 중일 때도 "마지막으로
  // 보고된 배터리가 몇 %였는지"가 원인 파악(배터리 방전인지 네트워크인지)에 가장 쓸모 있다.
  const batteryPill = document.getElementById('batteryPill');
  let batteryTimer = null, batteryPollPath = null, lastBattery = null, lastBatterySeverity = 0;

  function formatAge(sec){
    if (sec < 60) return `${sec}초 전`;
    if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
    return `${Math.floor(sec / 3600)}시간 전`;
  }
  function batterySeverity(s){
    if (s.charging) return 0;
    if (s.level <= BATTERY_CRITICAL) return 2;
    if (s.level <= BATTERY_LOW) return 1;
    return 0;
  }
  function renderBattery(s){
    const pct = Math.round(s.level * 100);
    const stale = s.age > BATTERY_STALE_AFTER;
    const severity = batterySeverity(s);
    batteryPill.textContent = `🔋 ${pct}%${s.charging ? ' ⚡' : ''}${stale ? ` · ${formatAge(s.age)}` : ''}`;
    batteryPill.title = `카메라 폰 배터리 · 마지막 보고 ${formatAge(s.age)}`;
    batteryPill.className = 'battery-pill' + (stale ? ' stale' : severity === 2 ? ' critical' : severity === 1 ? ' low' : '');
    batteryPill.hidden = false;

    // 상황이 나빠지는 순간에만 한 번씩 알린다 — 재생 컨트롤이 숨어 있어도 보이도록 토스트로.
    if (!stale) {
      if (lastBattery && lastBattery.charging && !s.charging) flash(`카메라 폰 충전기가 분리되었습니다 (배터리 ${pct}%)`);
      else if (severity > lastBatterySeverity) flash(`카메라 폰 배터리 부족 (${pct}%) — 충전이 필요합니다`);
      lastBatterySeverity = severity;
      lastBattery = s;
    }
  }
  async function pollBattery(){
    clearTimeout(batteryTimer);
    const path = batteryPollPath;
    if (!path) return;
    batteryTimer = setTimeout(pollBattery, BATTERY_POLL_INTERVAL);
    if (document.visibilityState === 'hidden') return; // 백그라운드에선 쉬고, 돌아오면 즉시 갱신(아래 리스너)
    try {
      const res = await fetch(`/${encodeURIComponent(path)}/status`, {
        headers: { 'Authorization': 'Basic ' + btoa(`family-viewer:${config.pin}`) },
        cache: 'no-store',
      });
      if (path !== batteryPollPath) return; // 그 사이 다른 카메라로 바꿨다
      if (res.status === 401 || res.status === 403) { stopBatteryPolling(); return; } // PIN 오류 — 두드리지 않는다
      if (res.status === 404) { batteryPill.hidden = true; return; } // 아직 보고 없음(배터리 API 미지원 기기 포함)
      if (!res.ok) return; // 일시 오류 — 마지막 표시를 유지
      const s = await res.json();
      if (typeof s.level === 'number' && typeof s.charging === 'boolean' && typeof s.age === 'number') renderBattery(s);
    } catch (e) { /* 네트워크 오류 — 마지막 표시를 유지하고 다음 주기에 다시 */ }
  }
  function startBatteryPolling(path){
    stopBatteryPolling();
    batteryPollPath = path;
    pollBattery();
  }
  function stopBatteryPolling(){
    clearTimeout(batteryTimer);
    batteryPollPath = null;
    lastBattery = null;
    lastBatterySeverity = 0;
    batteryPill.hidden = true;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && batteryPollPath) pollBattery();
  });

  // ───────────────────────── 메인 시청 흐름 ─────────────────────────
  async function startWatching(){
    setStatus('connecting', '연결 중…');
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    remoteStream = new MediaStream();
    playerVideo.srcObject = remoteStream;
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    pc.ontrack = (e) => remoteStream.addTrack(e.track);
    pc.addEventListener('connectionstatechange', onConnectionStateChange);

    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIceGatheringComplete(pc, ICE_GATHER_TIMEOUT);
      sessionUrl = await playWhep(pc, config.path, config.pin);
      setStatus('live', 'LIVE');
      startWatchdog();
      playerVideo.play().catch(() => {}); // 자동재생 실패는 무음 상태이므로 대개 통과, 실패 시 언뮤트 탭에서 재시도
    } catch (e) {
      handleConnectFailure(e);
    }
  }

  function connectTo(path, pin){
    config = { path, pin };
    history.replaceState(null, '', `#cam=${encodeURIComponent(path)}&pin=${encodeURIComponent(pin)}`);
    camNameLabel.textContent = path;
    showScreen('player');
    resetZoom(false); // 다른 카메라는 전체 보기부터
    unmuteOverlay.hidden = false;
    pushRecent(path, pin);
    startWatching();
    startBatteryPolling(path);
  }

  // ───────────────────────── §2.2 iOS 언뮤트(사용자 제스처 안에서 동기 실행) ─────────────────────────
  document.getElementById('unmuteBtn').addEventListener('click', () => {
    playerVideo.muted = false;
    playerVideo.play().catch(() => {});
    unmuteOverlay.hidden = true;
  });

  // ───────────────────────── §2.2 전체화면(iOS webkitEnterFullscreen 폴백) ─────────────────────────
  // <video>가 아니라 플레이어 영역 전체를 올린다 — 그래야 전체화면에서도 확대/축소와
  // 재생 컨트롤이 그대로 동작한다(<video> 자체를 올리면 브라우저가 transform을 지운다).
  // 요소 전체화면이 없는 iPhone만 네이티브 비디오 전체화면으로 폴백한다 — 이때는 iOS
  // 자체 플레이어라 여기의 확대 대신 iOS 제스처를 쓰게 된다.
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
    if (document.webkitFullscreenElement) { document.webkitExitFullscreen(); return; }
    if (document.fullscreenEnabled && playerWrap.requestFullscreen) {
      playerWrap.requestFullscreen().catch(() => flash('전체화면으로 전환할 수 없습니다'));
    }
    else if (document.webkitFullscreenEnabled && playerWrap.webkitRequestFullscreen) playerWrap.webkitRequestFullscreen();
    else if (playerVideo.webkitEnterFullscreen) playerVideo.webkitEnterFullscreen();
    else if (playerVideo.requestFullscreen) playerVideo.requestFullscreen();
    else flash('이 브라우저는 전체화면을 지원하지 않습니다');
  });
  // <video>를 직접 올릴 때 안드로이드 크롬이 해 주던 "영상 방향에 맞춰 화면 돌리기"를
  // 플레이어 영역 전체화면에서도 똑같이 해 준다(데스크톱 등 미지원 환경은 조용히 무시).
  document.addEventListener('fullscreenchange', () => {
    const o = screen.orientation;
    if (!o || !o.lock) return;
    if (document.fullscreenElement === playerWrap && playerVideo.videoWidth) {
      o.lock(playerVideo.videoWidth >= playerVideo.videoHeight ? 'landscape' : 'portrait').catch(() => {});
    } else if (!document.fullscreenElement) {
      try { o.unlock(); } catch (e) {}
    }
  });

  // ───────────────────────── 확대/축소(핀치·드래그·더블탭·휠·버튼) ─────────────────────────
  // 기본은 1배 = 영상 전체가 레터박스 안에 다 보이는 상태다. 확대는 화면에 그리는 방식만
  // 바꾸는 transform이라 스트림·서버는 그대로이고, 녹화 파일도 확대와 무관하게 원본 전체로
  // 저장된다. 상태는 "배율 + 화면 한가운데 오는 영상 속 지점(0~1로 정규화)"으로 들고
  // 있다 — 회전·전체화면 전환으로 화면 크기가 바뀌어도 보던 곳을 그대로 유지하기 위해서다.
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomBadge = document.getElementById('zoomBadge');
  const zoom = { s: 1, u: 0.5, v: 0.5 };

  // 영상 상자(=플레이어 영역) 크기와, 그 안에서 contain으로 그려진 실제 영상의 위치·크기
  function zoomGeometry(){
    const W = playerVideo.clientWidth, H = playerVideo.clientHeight;
    const vw = playerVideo.videoWidth || W, vh = playerVideo.videoHeight || H;
    const fit = Math.min(W / vw, H / vh) || 0;
    const cw = vw * fit, ch = vh * fit;
    return { W, H, cw, ch, cx: (W - cw) / 2, cy: (H - ch) / 2 };
  }
  // 한 축의 이동량 제한: 확대된 영상이 화면보다 작으면 가운데, 크면 가장자리에 빈틈이 안 생기게
  function clampAxis(t, s, view, c0, c){
    if (s * c <= view) return (view - s * c) / 2 - s * c0;
    return Math.min(-s * c0, Math.max(view - s * (c0 + c), t));
  }
  function zoomTranslate(g){
    return {
      tx: clampAxis(g.W / 2 - zoom.s * (g.cx + zoom.u * g.cw), zoom.s, g.W, g.cx, g.cw),
      ty: clampAxis(g.H / 2 - zoom.s * (g.cy + zoom.v * g.ch), zoom.s, g.H, g.cy, g.ch),
    };
  }
  function setZoomCenter(g, tx, ty){
    zoom.u = ((g.W / 2 - tx) / zoom.s - g.cx) / g.cw;
    zoom.v = ((g.H / 2 - ty) / zoom.s - g.cy) / g.ch;
  }
  function renderZoom(animate){
    const g = zoomGeometry();
    if (!g.cw || !g.ch) return; // 화면이 숨겨져 크기가 0 — 다시 보일 때 ResizeObserver가 부른다
    const { tx, ty } = zoomTranslate(g);
    setZoomCenter(g, tx, ty); // 가장자리에서 더 끈 만큼은 버린다 — 반대로 끌 때 바로 따라오게
    const zoomed = zoom.s > 1;
    playerVideo.classList.toggle('zoom-animate', !!animate);
    playerVideo.style.transform = zoomed ? `translate(${tx}px, ${ty}px) scale(${zoom.s})` : '';
    const label = `${Math.round(zoom.s * 10) / 10}×`;
    zoomResetBtn.textContent = label;
    zoomResetBtn.setAttribute('aria-label', `현재 배율 ${label} — 누르면 원래 크기로`);
    zoomResetBtn.classList.toggle('active', zoomed);
    zoomOutBtn.disabled = !zoomed;
    zoomInBtn.disabled = zoom.s >= ZOOM_MAX;
    zoomBadge.textContent = `🔍 ${label}`;
    zoomBadge.hidden = !zoomed;
    playerWrap.classList.toggle('zoomed', zoomed);
  }
  // (px,py) 아래에 있던 영상 속 지점이 배율이 바뀐 뒤에도 같은 자리에 머물게 확대/축소
  function zoomAt(px, py, s, animate){
    const g = zoomGeometry();
    if (!g.cw || !g.ch) return;
    s = Math.min(ZOOM_MAX, Math.max(1, s));
    if (s < 1.02) s = 1; // 핀치로 1배 근처까지 줄였으면 정확히 1배(전체 보기)로 붙인다
    const { tx, ty } = zoomTranslate(g);
    const k = s / zoom.s;
    zoom.s = s;
    setZoomCenter(g, px - (px - tx) * k, py - (py - ty) * k);
    renderZoom(animate);
  }
  function panBy(dx, dy){
    if (zoom.s <= 1) return;
    const g = zoomGeometry();
    if (!g.cw || !g.ch) return;
    const { tx, ty } = zoomTranslate(g);
    setZoomCenter(g, tx + dx, ty + dy);
    renderZoom(false);
  }
  function resetZoom(animate){
    zoom.s = 1; zoom.u = 0.5; zoom.v = 0.5;
    renderZoom(animate);
  }
  function stepZoom(dir){
    const next = dir > 0
      ? ZOOM_LEVELS.find(l => l > zoom.s + 0.01)
      : [...ZOOM_LEVELS].reverse().find(l => l < zoom.s - 0.01);
    if (next !== undefined) zoomAt(playerVideo.clientWidth / 2, playerVideo.clientHeight / 2, next, true);
  }
  zoomInBtn.addEventListener('click', () => stepZoom(1));
  zoomOutBtn.addEventListener('click', () => stepZoom(-1));
  zoomResetBtn.addEventListener('click', () => resetZoom(true));

  // 포인터 이벤트 하나로 터치·펜·마우스를 함께 받는다: 두 손가락 = 핀치 확대 + 이동,
  // 한 손가락/마우스 드래그 = 확대 상태에서 이동, 더블탭/더블클릭 = 그 지점 확대 ↔ 전체 보기.
  const activePointers = new Map(); // pointerId → 플레이어 영역 기준 좌표
  let pinch = null, tapStart = null, lastTap = null;
  function localPoint(e){
    const r = playerWrap.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function pinchState(){
    const [a, b] = activePointers.values();
    return { dist: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  playerWrap.addEventListener('pointerdown', (e) => {
    // 버튼 위에서 시작한 포인터는 가로채지 않고(캡처 없음) 평소처럼 클릭되게 둔다. 다만
    // 화면 한가운데의 "소리 켜기" 버튼처럼 큰 버튼에 손가락 하나가 걸쳐도 핀치는 되도록
    // 두 손가락 핀치에는 끼워 준다 — 혼자서는 이동도 탭도 하지 않는다.
    const onButton = !!e.target.closest('button');
    if (e.pointerType === 'mouse' && (onButton || e.button !== 0)) return;
    if (!onButton) { try { playerWrap.setPointerCapture(e.pointerId); } catch (err) {} }
    if (e.isPrimary) activePointers.clear(); // 새 제스처의 첫 손가락 — 놓친 pointerup이 남아 있어도 여기서 털어낸다
    const p = localPoint(e);
    activePointers.set(e.pointerId, { x: p.x, y: p.y, onButton });
    tapStart = activePointers.size === 1 && !onButton ? { id: e.pointerId, x: p.x, y: p.y, t: performance.now(), moved: false } : null;
    pinch = activePointers.size >= 2 ? pinchState() : null;
    if (!onButton) playerWrap.classList.add('panning');
  });
  playerWrap.addEventListener('pointermove', (e) => {
    const prev = activePointers.get(e.pointerId);
    if (!prev) return;
    const p = { ...localPoint(e), onButton: prev.onButton };
    activePointers.set(e.pointerId, p);
    if (tapStart && Math.hypot(p.x - tapStart.x, p.y - tapStart.y) > TAP_SLOP) tapStart.moved = true;
    if (activePointers.size >= 2) {
      const cur = pinchState();
      if (pinch && pinch.dist > 0) {
        zoomAt(pinch.x, pinch.y, zoom.s * cur.dist / pinch.dist);
        panBy(cur.x - pinch.x, cur.y - pinch.y);
      }
      pinch = cur;
    } else if (!prev.onButton) {
      panBy(p.x - prev.x, p.y - prev.y);
    }
  });
  function endPointer(e){
    if (!activePointers.delete(e.pointerId)) return;
    pinch = activePointers.size >= 2 ? pinchState() : null;
    if (activePointers.size === 0) playerWrap.classList.remove('panning');
    const t = tapStart;
    if (!t || t.id !== e.pointerId) return;
    tapStart = null;
    const now = performance.now();
    if (e.type !== 'pointerup' || t.moved || now - t.t > TAP_MAX_MS) return;
    if (lastTap && now - lastTap.t < DOUBLE_TAP_MS && Math.hypot(t.x - lastTap.x, t.y - lastTap.y) < DOUBLE_TAP_SLOP) {
      lastTap = null;
      if (zoom.s > 1) resetZoom(true);
      else zoomAt(t.x, t.y, ZOOM_DOUBLE_TAP, true);
    } else {
      lastTap = { x: t.x, y: t.y, t: now };
    }
  }
  playerWrap.addEventListener('pointerup', endPointer);
  playerWrap.addEventListener('pointercancel', endPointer);

  // 마우스 휠·트랙패드 핀치(크롬은 ctrlKey가 붙은 wheel로 온다) — 커서 지점을 기준으로
  playerWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * playerWrap.clientHeight : e.deltaY;
    const p = localPoint(e);
    zoomAt(p.x, p.y, zoom.s * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.002)));
    revealChrome();
  }, { passive: false });

  // Safari 전용 제스처 이벤트: 페이지 자체가 확대되는 걸 막는다. 맥 트랙패드 핀치는
  // 이 이벤트로만 오므로 여기서 확대로 옮기고, 터치(iOS)는 위 포인터 핀치가 이미
  // 처리하므로 손가락이 화면에 닿아 있는 동안은 무시한다(이중 확대 방지).
  let gestureBaseZoom = null;
  playerWrap.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureBaseZoom = zoom.s; });
  playerWrap.addEventListener('gesturechange', (e) => {
    e.preventDefault();
    if (gestureBaseZoom === null || activePointers.size > 0) return;
    const p = localPoint(e);
    zoomAt(p.x, p.y, gestureBaseZoom * e.scale);
  });
  playerWrap.addEventListener('gestureend', (e) => { e.preventDefault(); gestureBaseZoom = null; });

  // 키보드(데스크톱): + / - 단계 확대·축소, 0 원래 크기
  document.addEventListener('keydown', (e) => {
    if (screens.player.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '+' || e.key === '=') stepZoom(1);
    else if (e.key === '-' || e.key === '_') stepZoom(-1);
    else if (e.key === '0') resetZoom(true);
    else return;
    e.preventDefault();
    revealChrome();
  });

  // 화면 회전·전체화면 전환(영역 크기 변화)과 송출 해상도·방향 변화(영상 크기 변화)에
  // 맞춰 다시 배치한다 — 보고 있던 지점과 배율은 유지된다.
  if (window.ResizeObserver) new ResizeObserver(() => renderZoom(false)).observe(playerWrap);
  else window.addEventListener('resize', () => renderZoom(false));
  playerVideo.addEventListener('resize', () => renderZoom(false));

  // ───────────────────────── 재생 컨트롤 자동 숨김 ─────────────────────────
  let chromeHideTimer = null;
  function revealChrome(){
    playerWrap.classList.remove('chrome-hidden');
    clearTimeout(chromeHideTimer);
    chromeHideTimer = setTimeout(() => playerWrap.classList.add('chrome-hidden'), 3200);
  }
  playerWrap.addEventListener('pointerdown', revealChrome);

  // ───────────────────────── §2.3 로컬 녹화(서버 미경유 — 뷰어 브라우저 안에서만 저장) ─────────────────────────
  function setRecordingUI(active){
    document.getElementById('recordBtn').classList.toggle('recording', active);
    document.getElementById('recordBtn').textContent = active ? '⏹' : '⏺';
    recBadge.hidden = !active;
    if (active) {
      recStartedAt = Date.now();
      recTimerHandle = setInterval(() => {
        const s = Math.floor((Date.now() - recStartedAt) / 1000);
        recTimer.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }, 500);
    } else {
      clearInterval(recTimerHandle);
    }
  }

  function startRecording(){
    if (!remoteStream || remoteStream.getTracks().length === 0) { flash('아직 수신 중인 영상이 없습니다'); return; }
    const mime = pickSupportedMime();
    try {
      recorder = mime ? new MediaRecorder(remoteStream, { mimeType: mime }) : new MediaRecorder(remoteStream);
    } catch (e) {
      flash('이 브라우저에서는 녹화를 지원하지 않습니다');
      return;
    }
    recordedChunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    recorder.onerror = () => { flash('녹화 중 오류가 발생했습니다'); stopRecording(); };
    recorder.onstop = () => saveRecording(recorder.mimeType || mime);
    try { recorder.start(1000); }
    catch (e) { flash('녹화 시작 실패 — 이 브라우저에서는 미지원'); return; } // §2.3 isTypeSupported()가 true여도 start()가 실패하는 iOS 사례 대응
    setRecordingUI(true);
  }
  function stopRecording(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    setRecordingUI(false);
  }
  function saveRecording(mime){
    if (recordedChunks.length === 0) { flash('저장할 녹화 내용이 없습니다'); return; }
    const blob = new Blob(recordedChunks, { type: mime || 'video/webm' });
    const ext = /mp4/i.test(mime || '') ? 'mp4' : 'webm';
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `homecam-${config.path}-${ts}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    recordedChunks = [];
    flash('녹화 파일을 저장했습니다');
  }
  document.getElementById('recordBtn').addEventListener('click', () => {
    if (recorder && recorder.state === 'recording') stopRecording();
    else startRecording();
  });

  // ───────────────────────── PIN 표시 토글 ─────────────────────────
  // 화면에 점으로만 보이면 오타를 눈으로 확인할 수 없어 "PIN 오류"의 원인이
  // 오타인지 서버 설정인지 구분이 안 된다. 기본은 가림이고, 폼을 떠날 때는
  // 자동으로 다시 가려 어깨너머로 노출되는 시간을 입력 중으로만 한정한다.
  const pinInput = document.getElementById('pinInput');
  const pinRevealBtn = document.getElementById('pinReveal');
  function setPinRevealed(on){
    if (on === (pinInput.type === 'text')) return;
    const focused = document.activeElement === pinInput;
    let start = null, end = null;
    try { start = pinInput.selectionStart; end = pinInput.selectionEnd; } catch (e) { /* 일부 브라우저는 password에서 접근 불가 */ }
    pinInput.type = on ? 'text' : 'password';
    pinRevealBtn.classList.toggle('revealed', on);
    pinRevealBtn.setAttribute('aria-pressed', String(on));
    pinRevealBtn.setAttribute('aria-label', on ? 'PIN 가리기' : 'PIN 표시');
    // type을 바꾸면 캐럿이 밀리고 포커스가 빠지는 브라우저가 있다 — 되돌린다.
    // 동기 복원만으로는 부족하다: 클릭 처리가 끝난 뒤 선택 영역을 0으로 되돌리는
    // 브라우저가 있어(Chromium 실측) 다음 틱에 한 번 더 적용한다. 그 사이 사용자가
    // 다른 곳을 눌렀다면 포커스를 도로 빼앗지 않도록 그때는 건너뛴다.
    if (!focused || start === null) return;
    pinInput.focus();
    const restoreCaret = () => { try { pinInput.setSelectionRange(start, end); } catch (e) {} };
    restoreCaret();
    // 동기 복원만으로는 유지되지 않는다 — 클릭 처리가 끝난 뒤 선택 영역을 0으로
    // 되돌리는 브라우저가 있다(Chromium 실측: type을 어떻게 바꿔 써도 동일).
    // 그래서 다음 틱에 한 번 더 적용하되, 그 사이 사용자가 이미 타이핑했거나
    // 다른 곳으로 옮겨갔다면 끼어들지 않는다 — 끼어들면 캐럿이 입력 도중에
    // 튀어 오히려 글자가 엉킨다.
    const valueAtToggle = pinInput.value;
    setTimeout(() => {
      if (document.activeElement === pinInput && pinInput.value === valueAtToggle) restoreCaret();
    }, 0);
  }
  // 버튼이 포커스를 가져가면 모바일에서 키보드가 닫히고 캐럿 위치가 날아간다.
  // mousedown 기본 동작(포커스 이동)을 막아 입력 중에도 커서가 그대로 남게 한다.
  pinRevealBtn.addEventListener('mousedown', e => e.preventDefault());
  pinRevealBtn.addEventListener('click', () => setPinRevealed(pinInput.type === 'password'));

  // ───────────────────────── 폼/내비게이션 ─────────────────────────
  document.getElementById('setupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const path = document.getElementById('pathInput').value.trim();
    const pin = document.getElementById('pinInput').value.trim();
    const errEl = document.getElementById('setupErr');
    if (!PATH_PIN_RE.test(path) || !PATH_PIN_RE.test(pin)) {
      errEl.textContent = '영문 소문자·숫자·- _ 만 사용할 수 있습니다(1~32자).';
      return;
    }
    errEl.textContent = '';
    setPinRevealed(false); // 연결되면 더 볼 이유가 없다
    connectTo(path, pin);
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    cleanupConnection();
    stopBatteryPolling();
    if (recorder && recorder.state === 'recording') stopRecording();
    history.replaceState(null, '', location.pathname);
    document.getElementById('pathInput').value = config.path;
    setPinRevealed(false); // 설정 화면으로 되돌아올 때도 가린 상태로 시작한다
    renderRecent();
    showScreen('setup');
  });

  window.addEventListener('beforeunload', cleanupConnection);

  // ───────────────────────── 초기화 ─────────────────────────
  renderRecent();
  const initial = loadConfig();
  if (PATH_PIN_RE.test(initial.path) && PATH_PIN_RE.test(initial.pin)) {
    document.getElementById('pathInput').value = initial.path;
    connectTo(initial.path, initial.pin);
  } else {
    showScreen('setup');
  }
})();
</script>
</body>
</html>
