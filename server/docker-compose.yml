###############################################################################
# docker-compose.yml — 홈캠 릴레이 컨테이너 스택 (§5.1 배포 절차를 대체)
#
# Tailscale은 의도적으로 컨테이너화하지 않는다: `tailscale cert` 인증서 발급이
# 호스트의 tailnet 신원에 묶여 있고, VPN을 컨테이너 네트워크 네임스페이스
# 사이드카로 넣으면 NET_ADMIN 권한과 DOCKER-USER iptables 관리가 추가로
# 필요해져 방화벽 우회 위험이 커진다. 그래서 Tailscale은 지금처럼 호스트에
# 네이티브(systemd)로 남기고, 컨테이너화 대상은 Caddy·MediaMTX 둘뿐이다.
#
# ⚠ Docker는 --publish/ports로 연 포트를 자체 iptables 규칙(DOCKER 체인)으로
# 처리하며, 이 규칙이 ufw의 차단 규칙보다 먼저 매칭된다 — "0.0.0.0으로 연
# 포트는 ufw가 막아준다"는 전제가 Docker 앞에서는 성립하지 않는다. 이 파일은
# 아래 두 가지로 그 위험을 원천 차단한다:
#   1) caddy는 "${TAILSCALE_IP}:${HOMECAM_PORT}:${HOMECAM_PORT}"처럼 반드시
#      Tailscale IP를 못박아 바인딩한다 — Tailscale IP로만 바인딩된 소켓은
#      애초에 공인 인터페이스로 DNAT될 여지가 없다. IP 부분을 "0.0.0.0"이나
#      생략형으로 절대 바꾸지 말 것.
#   2) mediamtx의 WHIP/WHEP(8889)는 호스트에 전혀 게시하지 않는다 — internal
#      브리지 네트워크로 caddy 컨테이너만 접근한다.
#
# HOMECAM_PORT: 기본 443이지만 고정값이 아니다 — Tailscale로만 접근 가능하므로
# 443이어야 할 이유가 없고, VPS를 다른 서비스와 같이 쓰는 중이라 443이 이미
# 점유돼 있으면(예: 기존 nginx) setup.sh 두 번째 인자로 다른 포트를 넘기면
# .env에 자동 반영된다.
#
# 배포(setup.sh가 자동 실행하지만 수동으로도):
#   cd server && docker compose up -d
# 프런트엔드(index.html/camera.html) 갱신은 저장소에서 git pull만 하면
# 끝난다 — 아래 볼륨이 파일을 직접 바인드 마운트하므로 재시작도 필요 없다.
###############################################################################

services:
  mediamtx:
    image: bluenviron/mediamtx:1.17.1
    container_name: homecam-mediamtx
    restart: unless-stopped
    volumes:
      - /etc/homecam/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - internal
    ports:
      # 제어 API(§4.3) — 호스트 루프백에만 게시. SSH 터널 전용 설계이므로
      # "127.0.0.1:" 접두사를 절대 지우지 말 것.
      - "127.0.0.1:9997:9997"
      # WHIP/WHEP(8889)는 여기 없다 — caddy만 internal 네트워크로 접근한다.

  caddy:
    image: caddy:2.11.4-alpine
    container_name: homecam-caddy
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      - /etc/homecam/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/homecam/certs:/etc/homecam/certs:ro
      - ../index.html:/var/www/homecam/index.html:ro
      - ../camera.html:/var/www/homecam/camera.html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    ports:
      # ⚠ 반드시 Tailscale IP로 명시 바인딩(위 경고 참고). setup.sh가 .env에
      # `tailscale ip -4`의 결과를 TAILSCALE_IP로, 포트를 HOMECAM_PORT로 채워 넣는다.
      - "${TAILSCALE_IP}:${HOMECAM_PORT}:${HOMECAM_PORT}"

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
